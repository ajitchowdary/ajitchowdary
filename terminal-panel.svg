<svg width="1100" height="600" viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .scan { animation: scan 3.5s linear infinite; }
      @keyframes scan {
        0%   { transform: translateY(0px); opacity: 0.9; }
        50%  { transform: translateY(430px); opacity: 0.4; }
        100% { transform: translateY(0px); opacity: 0.9; }
      }
      .blink { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      .lbl { fill: #7dd3fc; font-size: 14px; }
      .val { fill: #e5e7eb; font-size: 14px; }
      .dot { fill: #475569; }
      .hdr { fill: #4ade80; font-size: 14px; }
      .sec { fill: #38bdf8; font-size: 13px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="2" y="2" width="1096" height="596" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <rect x="6" y="6" width="1088" height="588" rx="12" fill="#0a0e14"/>

